name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and locate project
        run: |
          # Find the zip file and unzip it
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found in repository!"
            exit 1
          fi
          unzip -q "$ZIP_FILE"
          rm "$ZIP_FILE"
          
          # Check if gradlew exists in the root, if not, find it
          if [ ! -f "gradlew" ]; then
            echo "Looking for gradlew in subfolders..."
            cd $(find . -maxdepth 1 -type d -not -path '*/.*' | tail -n 1)
          fi
          
          chmod +x gradlew
          echo "Project located at: $(pwd)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
